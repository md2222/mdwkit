<style type="text/css">

body {

    position: absolute;
    right: 8px;

.list {

    padding: 0 30px 0 5px;

    height:auto;

}
.list li {

.task-text {

    color: #909090;
}    
.dragging {

#taskText {

<script type="text/javascript">

var tasks = [];
var colId = 'col1';
var taskId = "";
var isDataChanged = false;
var currFileName = "0";
var isTimer = false;
var saveData = "";

var loc = window.location;
var docDir = loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
console.log("docDir=" + docDir);


$(function() {

$("#selFileName" ).val("0");

$("#selFileName" ).change(function() {
	var f = $(this).val();

	if (f == "0") {
		$(this).val(currFileName);
		return;
	}
		
    if (isDataChanged)
        if (!confirm("Data has been changed. Do you want save data?")) {
			$(this).val(currFileName);
            return;
		}
		
	if (f != "0") {
		currFileName = f;
        document.title = currFileName;
		loadFile($(this).val());
	}
	return true;
});

$(".list").dragsort({ 
    dragSelector: "li", 
    dragSelectorExclude: "a", 
    dragBetween: true, 
    dragEnd: function() {
        $(this).attr("col", $(this).parent().attr("id"));
        //isDataChanged = true;
		setDataChanged();
        $("#saveButton").children('img').attr('src', 'js/images/save-03-1.png');
        setCounts();
    }, 
    scrollContainer: ".column-list",
    scrollSpeed: 10,
    placeHolderTemplate: "<li class='placeHolder'></li>" 
});


$(".column").resize(function() {
    $(this).children(".column-list").width($(this).width() - 5);
    //$(this).children(".list").width($(this).width() - 10);
});
    

$("#dlgTask").dialog({
    dialogClass: "dialog",
    autoOpen: false,
    width: 760,
    resizable: false,
    buttons: {
        "ОК": function() { 
            editTask();
            $(this).dialog("close"); 
        }, 
        "Delete": function() { 
            if (taskId != "" && confirm("Really delete this task?")) {
                $("#" + taskId).remove();
                //isDataChanged = true;
				setDataChanged();
                $("#saveButton").children('img').attr('src', 'js/images/save-03-1.png');
                setCounts();
                $(this).dialog("close"); 
            }
        },
        "Cancel": function() { 
            $(this).dialog("close"); 
        }
    },
    modal: true
});

$('select[name="colorList"]')
    .simplecolorpicker('selectColor', '#ffffff');

        $("#taskText").css('background-color', $('select[name="colorList"]').val());
    }); */


function onResize() {
    $(".column").height($(window).height() - $("#header").height() - 80);
    $(".column").width(($(window).width() - 50)/3);
};

$(window).resize(function() {            
    onResize();            
});

$(document).ready(function() {
    onResize();

    $("#selFileName" ).val("home.json");
    $("#selFileName" ).trigger("change");
});

});




function setDataChanged() {
	isDataChanged = true;
	if (!isTimer) {
		isTimer = true;
		setTimeout(onSave, 60000);
	}	
}



function loadFile(fn)
{
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "file://" + docDir + fn, true);  //++
    //xhr.setRequestHeader("Cache-Control", "no-cache");  //--
xhr.setRequestHeader('expires', 'Tue, 01 Jan 1980 1:00:00 GMT');
    
    xhr.onload = function () {
        console.log("xhr.responseText=" + xhr.responseText);
        if (xhr.responseText == "") tasks = []
        else tasks = JSON.parse(xhr.responseText);
        fillColumns();
    };

    xhr.send();    
    
	/*$.ajax({
		url: "file://" + docDir + fn,
		data: "",
        dataType: "text",
		cache: false,
		async: false,
        crossDomain: true,
		error: function(xhr, textStatus, error) {
			alert("Request error: " + xhr.status);
		},
		success: function(data) {
			if (data == "") tasks = []
		    else tasks = JSON.parse(data);
		    fillColumns();
		} 
	}); */
}


function onClose()
{
    if (isDataChanged)
        return "Data has been changed. Do you want save data?";
    else
        return;
}

window.onbeforeunload = onClose;


function linkify(str) {
    // http://, https://, ftp://
    var urlPattern = /\b(?:https?|ftp):\/\/[a-z0-9-+&@#\/%?=~_|!:,.;]*[a-z0-9-+&@#\/%=~_|]/gim;
    // www. sans http:// or https://
    var pseudoUrlPattern = /(^|[^\/])(www\.[\S]+(\b|$))/gim;
    // Email addresses
    var emailAddressPattern = /[\w.]+@[a-zA-Z_-]+?(?:\.[a-zA-Z]{2,6})+/gim;

    return str
        .replace(urlPattern, '<a href="$&">$&</a>')
        .replace(pseudoUrlPattern, '$1<a href="http://$2">$2</a>')
        .replace(emailAddressPattern, '<a href="mailto:$&">$&</a>');
}


function addTask(idx, col, text, color, info) {
    if (color == "" || color == "undefined") 
        color = "#ffffff";
        
    var task = $('<li id="t' + idx + '" col="' + col + '" color="' + color + '"><div class="task-text">' + linkify(text) 
        + '</div><div class="task-info">' + info + '</div></li>');
    task.dblclick(function() {
        taskId = $(this).attr("id");
        $("#taskText").val($(this).find('div.task-text').text());
        $('select[name="colorList"]').simplecolorpicker('selectColor', $(this).attr("color"));
        $("#dlgTask").dialog("open");
    });
    task.draggable({
         start: function( event, ui ) {
              $(this).addClass('dragging'); 
         },
         stop: function( event, ui ) {
              $(this).removeClass('dragging'); 
         }
    });
    task.css('background-color', color);
    $(".list[id='" + col + "']").append(task);
}


function setCounts () {
    $(".column").each(function() {
        $(this).find(".column-task-count").html("(" + $(this).find("li").length + ")");
    });
}


function fillColumns() {
    $(".list").each(function() {
        $(this).find("li").each( function() {
            $(this).remove();
        });
    });
    
    for (var i = 0; i < tasks.length; i++)
        addTask(i, tasks[i].col, tasks[i].text, tasks[i].color, tasks[i].info);
    
    setCounts();
    isDataChanged = false;
    $("#saveButton").children('img').attr('src', 'js/images/save-03-22.png');
}


function taskDialog(col) {
    colId = col;
    taskId = "";
    $("#taskText").val("");
    $('select[name="colorList"]').simplecolorpicker('selectColor', "#ffffff");
    $("#dlgTask").dialog("open");
}


function editTask() {
    var taskText = $("#taskText").val();
    if (taskText == "") return;
    var info = $("#taskInfo").text();
    
    if (taskId == "") {
        var d = new Date();
        var day = d.getDate();
        var month = d.getMonth() + 1;
        if (month < 10) month = '0' + month;
        var year = d.getFullYear()
        var info = day + "." + month + "." + year;
        
        var idx = tasks.length;
        var color = $('select[name="colorList"]').val();
        var task = {};
        task.id = "t" + idx;
        task.col = colId;
        task.text = taskText;
        task.info = info;
        task.color = color;
        tasks.push(task);
        
        addTask(idx, colId, taskText, color, info);
        setCounts();
    }
    else {
        //alert("#" + taskId + "~" + taskText);
        $("#" + taskId).contents('.task-text').html(linkify(taskText));
        var c = $('select[name="colorList"]').val();
        $("#" + taskId).attr("color", c)
        $("#" + taskId).css('background-color', c);
    }
    
    //isDataChanged = true;
	setDataChanged();
    $("#saveButton").children('img').attr('src', 'js/images/save-03-1.png');
}

function click(node) {
	var event = document.createEvent("MouseEvents");
	event.initMouseEvent("click", true, false, null, 0, 0, 0, 0, 0,
						false, false, false, false, 0, null);
	return node.dispatchEvent(event);
}


function stringifyTasks() {
	isTimer = false;
	if (!isDataChanged) return;
	
    tasks.splice(0, tasks.length);
    
    $(".list").each(function() {
        $(this).find("li").each( function() {
            var task = {};
            task.id = $(this).attr("id");
            task.col = $(this).attr("col");
            task.text = $(this).find(".task-text").text();
            task.info = $(this).find(".task-info").text();
            task.color = $(this).attr("color");
            tasks.push(task);
        });
    });
    
    return JSON.stringify(tasks);
}

            task.info = $(this).find(".task-info").text();
            task.color = $(this).attr("color");

        });
    });
    
    var file = docDir + currFileName;
/*

    var resp = JSON.parse(s);

        alert(resp.errText);
    else
    {
        isDataChanged = false;
        $("#saveButton").children('img').attr('src', 'js/images/save-03-22.png');

*/    
    var data = JSON.stringify(tasks);
    console.log("data=" + data);
    
    var res = jsCoreRequest("savedata?file=" + file, data);
    console.log("resp=" + res);
    
    var p = res.indexOf("\r\n\r\n");
    var header = JSON.parse(res.substr(0, p));

    if (!p || !header.errCode)  
        alert("Error response header bad format.\n" + header);
    else if (header.errCode != "0")
        alert(header.errText);
    else
    {
        isDataChanged = false;
        $("#saveButton").children('img').attr('src', 'js/images/save-03-22.png');

function onLoad() {
    if (isDataChanged && !confirm("The current data has been changed.\nWhen downloading, the changes will not be saved.\nContinue? ")) 
        return;

}

</script>
